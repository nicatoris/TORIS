name: iOS – Build & Upload to TestFlight

# Manual only: this submits a real build to Apple, so it never runs on a
# push/PR — trigger it from the Actions tab when you want a new TestFlight
# build. Runs on a macOS runner with real Xcode and unrestricted internet.
# Builds the native SwiftUI app in apple/ — no Expo, no Node.
on:
  workflow_dispatch: {}

jobs:
  build-and-upload:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Ruby (for Fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate --spec apple/project.yml

      # Fail early and legibly when credentials are missing. Without this,
      # fastlane feeds an empty key to OpenSSL and dies with a bare
      # "invalid curve name" stack trace that says nothing about secrets.
      - name: Verify Apple credentials are configured
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_CONTENT APPLE_TEAM_ID; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}. Add them under Settings → Secrets and variables → Actions; see the README section 'Shipping a TestFlight build' for how to generate each one."
            exit 1
          fi
          # Structural check only — never print the key itself.
          if ! printf '%s' "$ASC_KEY_CONTENT" | base64 --decode 2>/dev/null | grep -q "BEGIN PRIVATE KEY"; then
            echo "::error::ASC_KEY_CONTENT is not a base64-encoded .p8 private key. Re-encode the file Apple gave you with: base64 -i AuthKey_XXXXXXXX.p8 | pbcopy"
            exit 1
          fi
          echo "All four Apple credentials are present and ASC_KEY_CONTENT decodes to a private key."

      - name: Build and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # fastlane prints the real diagnosis hundreds of lines before it
          # exits, and gym tees only the *archive* to its own log — the export
          # failure lives solely in fastlane's stdout. Capture it and re-print
          # the relevant lines as the last thing this step does, so a failure
          # is legible without digging through the whole log.
          set +e
          bundle exec fastlane ios release_testflight 2>&1 | tee /tmp/fastlane.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo ""
            echo "=================== export / signing diagnosis ==================="
            grep -inE "exportArchive|IDEProvisioning|No profiles|signing certificate|doesn't (match|support)|Provisioning profile|Signing Identity|not available|permission|Forbidden|40[13]|does not exist|error:" /tmp/fastlane.log \
              | grep -viE "note: (Disabling|Building)" | tail -40 || echo "(nothing matched)"
            if grep -q "Cloud signing permission error" /tmp/fastlane.log; then
              echo ""
              echo "::error::Apple rejected distribution signing with 'Cloud signing permission error'. The app compiles, archives and signs for development — only DISTRIBUTION signing is refused. Apple restricts distribution certificates to the Account Holder and Admin roles; an App Manager key can create the development certificate this build already got, and nothing more. Fix: App Store Connect -> Users and Access -> Integrations -> edit the API key and set its access to Admin (or generate a new Admin key and update ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_CONTENT). Run the 'iOS - Diagnose signing' workflow afterwards to confirm."
            fi
            echo "================= end diagnosis (exit $status) ================="
            exit "$status"
          fi
