name: iOS – Build & Upload to TestFlight

# Manual only: this submits a real build to Apple, so it never runs on a
# push/PR — trigger it from the Actions tab when you want a new TestFlight
# build. Runs on a macOS runner with real Xcode and unrestricted internet,
# so it has none of the network limits of the dev sandbox this was set up
# from.
on:
  workflow_dispatch: {}

jobs:
  build-and-upload:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Generate the native iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Set up Ruby (for Fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Install CocoaPods dependencies
        run: cd ios && pod install

      - name: Build and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bundle exec fastlane ios release_testflight
