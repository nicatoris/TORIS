name: KSafe
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
targets:
  KSafe:
    type: application
    platform: iOS
    sources:
      - KSafe
    scheme:
      gatherCoverageData: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ksafetea
        PRODUCT_NAME: KSafe
        # The version testers see. Bump this by hand for a feature release
        # (2.0.0 -> 2.1.0); it is the only version field you need to edit.
        MARKETING_VERSION: "2.0.0"
        # Placeholder for local builds only — the TestFlight lane overrides
        # this per upload with the GitHub run number, since Apple rejects a
        # build number it has already accepted for the same MARKETING_VERSION.
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: KSafe
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # KSafe stores everything on-device and makes no network calls, so it
        # uses no non-exempt encryption. Declaring it here keeps uploads from
        # stalling in TestFlight's "Missing Compliance" state.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
