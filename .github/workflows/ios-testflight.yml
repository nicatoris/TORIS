name: iOS – Build & Upload to TestFlight

# Manual only: this submits a real build to Apple, so it never runs on a
# push/PR — trigger it from the Actions tab when you want a new TestFlight
# build. Runs on a macOS runner with real Xcode and unrestricted internet.
# Builds the native SwiftUI app in apple/ — no Expo, no Node.
on:
  workflow_dispatch: {}

jobs:
  build-and-upload:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Ruby (for Fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate --spec apple/project.yml

      # Fail early and legibly when credentials are missing. Without this,
      # fastlane feeds an empty key to OpenSSL and dies with a bare
      # "invalid curve name" stack trace that says nothing about secrets.
      - name: Verify Apple credentials are configured
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_CONTENT APPLE_TEAM_ID; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}. Add them under Settings → Secrets and variables → Actions; see the README section 'Shipping a TestFlight build' for how to generate each one."
            exit 1
          fi
          # Structural check only — never print the key itself.
          if ! printf '%s' "$ASC_KEY_CONTENT" | base64 --decode 2>/dev/null | grep -q "BEGIN PRIVATE KEY"; then
            echo "::error::ASC_KEY_CONTENT is not a base64-encoded .p8 private key. Re-encode the file Apple gave you with: base64 -i AuthKey_XXXXXXXX.p8 | pbcopy"
            exit 1
          fi
          echo "All four Apple credentials are present and ASC_KEY_CONTENT decodes to a private key."

      - name: Build and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          bundle exec fastlane ios release_testflight 2>&1 | tee /tmp/fastlane.log

      # fastlane prints the real failure hundreds of lines before it exits,
      # where log tailing never reaches it. gym only tees the *archive* to its
      # own log, so the export failure lives solely in fastlane's stdout —
      # hence the tee above. Re-surface what matters at the very end of the
      # job so a failure is diagnosable in one look.
      - name: Surface the xcodebuild failure
        if: failure()
        run: |
          fl=/tmp/fastlane.log
          if [ -f "$fl" ]; then
            echo "=================== export / signing errors ==================="
            grep -inE "exportArchive|IDEProvisioning|No profiles|No signing certificate|doesn't (match|support)|Provisioning profile|not available|permission|Forbidden|401|403|no such app|does not exist|error:" "$fl" \
              | grep -viE "note: (Disabling|Building)" | tail -45 || echo "(nothing matched)"
            echo
            echo "=================== last 40 lines of fastlane ==================="
            tail -40 "$fl"
          else
            echo "(no /tmp/fastlane.log)"
          fi
